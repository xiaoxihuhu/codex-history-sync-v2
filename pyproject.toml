[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-history-sync"
version = "2.0.0.dev0"
description = "Local repair and cloud backup for Codex Desktop history"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Codex History Sync contributors" }
]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
build = ["PyInstaller>=6.0", "build>=1.2"]

[project.scripts]
codex-history-sync = "codex_sync.cli:main"
codex-history-sync-gui = "codex_sync.gui:main"

[tool.setuptools.packages.find]
include = ["codex_sync*"]
